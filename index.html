<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="La Pegada: la plataforma de jugadas de lotería con método. Muy pronto.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#081426; color:#f5f0e1; font-family: Georgia, 'Times New Roman', serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px 20px; }
  img.logo { width:min(560px, 88vw); height:auto; }
  .pronto { margin-top:28px; font-family: Arial, Helvetica, sans-serif; letter-spacing:6px; font-size:clamp(15px,3.4vw,22px); color:#d4af37; text-transform:uppercase; }
  .frase { margin-top:14px; font-size:clamp(17px,4vw,24px); font-style:italic; color:#e8e2cf; max-width:640px; line-height:1.45; }
  .linea { width:120px; height:2px; background:linear-gradient(90deg, transparent, #d4af37, transparent); margin:26px auto 0; }

</head>
<body>
  <img class="logo" src="logo-rueda.webp" alt="La Pegada">
  <div class="pronto">✦ Muy pronto ✦</div>
